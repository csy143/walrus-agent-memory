<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>

  <!-- Brain (Memory) - Top Left -->
  <g transform="translate(60, 70)">
    <!-- Brain outline -->
    <path d="M 15 5 Q 10 5 8 10 Q 5 15 5 20 Q 5 28 12 32 Q 8 35 8 40 Q 8 45 15 48 L 15 5"
          fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 15 5 Q 20 5 22 10 Q 25 15 25 20 Q 25 28 18 32 Q 22 35 22 40 Q 22 45 15 48"
          fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Brain curves -->
    <path d="M 8 18 Q 12 16 15 17" fill="none" stroke="#06b6d4" stroke-width="1"/>
    <path d="M 22 18 Q 18 16 15 17" fill="none" stroke="#06b6d4" stroke-width="1"/>
  </g>

  <!-- Walrus (Storage) - Top Right -->
  <g transform="translate(120, 70)">
    <!-- Walrus body -->
    <ellipse cx="10" cy="15" rx="8" ry="12" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <!-- Walrus tusk -->
    <line x1="5" y1="20" x2="2" y2="28" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="20" x2="18" y2="28" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Chain/Connection - Bottom -->
  <g transform="translate(50, 130)">
    <!-- Blockchain nodes -->
    <circle cx="10" cy="10" r="3" fill="#06b6d4"/>
    <circle cx="25" cy="10" r="3" fill="#06b6d4"/>
    <circle cx="40" cy="10" r="3" fill="#06b6d4"/>
    <!-- Connection lines -->
    <line x1="13" y1="10" x2="22" y2="10" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="28" y1="10" x2="37" y2="10" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Central Agent Node (Circle with glow) -->
  <g transform="translate(100, 100)">
    <!-- Glow effect -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.3"/>
    <!-- Main node -->
    <circle cx="0" cy="0" r="12" fill="#0ea5e9"/>
    <!-- Inner highlight -->
    <circle cx="0" cy="0" r="10" fill="#06b6d4"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="5" fill="#f0f9ff"/>
  </g>

  <!-- Connection lines from center to elements -->
  <!-- To Brain -->
  <line x1="88" y1="88" x2="72" y2="78" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <!-- To Walrus -->
  <line x1="112" y1="88" x2="128" y2="78" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <!-- To Chain -->
  <line x1="92" y1="112" x2="75" y2="125" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="108" y1="112" x2="105" y2="130" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>

  <!-- Decorative stars for innovation -->
  <g fill="#fbbf24" opacity="0.7">
    <!-- Top star -->
    <polygon points="100,25 102,31 108,31 103,35 105,41 100,37 95,41 97,35 92,31 98,31" />
    <!-- Right star -->
    <polygon points="165,100 167,106 173,106 168,110 170,116 165,112 160,116 162,110 157,106 163,106" />
    <!-- Left star -->
    <polygon points="35,100 37,106 43,106 38,110 40,116 35,112 30,116 32,110 27,106 33,106" />
  </g>
</svg>
